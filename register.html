<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account | Police Portal</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><main class="auth-card">
<a class="brand" href="index.html"><span class="brand-mark">✦</span><span><b>POLICE PORTAL</b><small>Attendance & Schedule Management</small></span></a>
<div class="eyebrow">NEW ACCOUNT</div><h1>Create your profile.</h1><p class="muted">Set up a demo account to explore the portal.</p>
<form id="registerForm" class="stack-form">
<label>Full name<input id="regName" required placeholder="Officer full name"></label>
<label>Badge / employee ID<input id="regBadge" required placeholder="e.g. PR-1042"></label>
<label>Email address<input id="regEmail" type="email" required placeholder="officer@example.com"></label>
<label>Role<select id="regRole"><option>Officer</option><option>Supervisor</option><option>Administrator</option></select></label>
<label>Password<input id="regPassword" type="password" required minlength="4" placeholder="At least 4 characters"></label>
<button class="btn primary full" type="submit">Create account <span>→</span></button>
</form><div class="auth-foot">Already registered? <a href="index.html">Sign in</a></div>
<p class="tiny muted">For demonstration only. This is not a secure production authentication system.</p>
</main><script src="js/app.js"></script></body></html>
