<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Police Portal | Sign in</title><link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="index.html"><span class="brand-mark">✦</span><span><b>POLICE PORTAL</b><small>Attendance & Schedule Management</small></span></a>
    <div class="eyebrow">SECURE ACCESS</div><h1>Welcome back.</h1><p class="muted">Sign in to manage attendance, shifts and duty allocation.</p>
    <form id="loginForm" class="stack-form">
      <label>Email address<input type="email" id="loginEmail" placeholder="officer@example.com" required></label>
      <label>Password<input type="password" id="loginPassword" placeholder="Enter your password" required minlength="4"></label>
      <button class="btn primary full" type="submit">Sign in <span>→</span></button>
    </form>
    <div class="auth-foot">New to the portal? <a href="register.html">Create an account</a></div>
    <p class="tiny muted">Demo project: account data is stored in this browser only. Do not use real sensitive information.</p>
  </main>
  <script src="js/app.js"></script>
</body></html>
